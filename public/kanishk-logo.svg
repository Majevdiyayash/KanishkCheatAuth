<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#03030a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Inner Core K Gradient -->
    <linearGradient id="kCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Shield Base Background -->
  <path d="M256 44 L416 112 V248 C416 352 344 428 256 468 C168 428 96 352 96 248 V112 L256 44 Z" 
        fill="#090a12" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        filter="url(#neonGlow)"/>

  <!-- Inner Cyber Tech Lines -->
  <path d="M256 72 L388 128 V248 C388 334 326 398 256 432 C186 398 124 334 124 248 V128 L256 72 Z" 
        fill="none" 
        stroke="rgba(0, 240, 255, 0.25)" 
        stroke-width="3" 
        stroke-dasharray="8 6"/>

  <!-- Center Security Lock Ring -->
  <circle cx="256" cy="248" r="110" fill="rgba(0, 102, 255, 0.15)" stroke="url(#shieldGrad)" stroke-width="4"/>

  <!-- Stylized "K" + Keyhole Security Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Bar of K -->
    <path d="M190 170 V326 C190 332 196 336 202 336 H222 C228 336 232 332 232 326 V170 C232 164 228 160 222 160 H202 C196 160 190 164 190 170 Z" 
          fill="url(#kCoreGrad)"/>

    <!-- Upper Diagonal Arm of K -->
    <path d="M228 244 L298 168 C302 164 308 164 314 168 L330 182 C335 186 335 194 330 199 L262 268 Z" 
          fill="url(#kCoreGrad)"/>

    <!-- Lower Diagonal Arm of K -->
    <path d="M252 258 L328 327 C333 332 333 339 328 344 L312 358 C306 363 300 363 295 358 L222 284 Z" 
          fill="url(#kCoreGrad)"/>

    <!-- Keyhole Core Dot -->
    <circle cx="256" cy="248" r="14" fill="#ffffff"/>
    <polygon points="250,256 262,256 266,280 246,280" fill="#ffffff"/>
  </g>

  <!-- Sparkle Accents -->
  <polygon points="256,100 260,112 272,116 260,120 256,132 252,120 240,116 252,112" fill="#00f0ff"/>
  <polygon points="380,240 383,248 391,251 383,254 380,262 377,254 369,251 377,248" fill="#00f0ff"/>
</svg>
