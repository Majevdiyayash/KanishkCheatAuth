  <!-- Quantum Plexus & 3D Neural Lattice Animation Engine -->
  <script>
    (function() {
      const canvas = document.getElementById('plexusCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let animId;
      const mouse = { x: -9999, y: -9999 };

      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      document.addEventListener('mouseleave', () => {
        mouse.x = -9999;
        mouse.y = -9999;
      });

      const plexusNodes = [];
      const plexusColors = ['#00f0ff', '#ffd700', '#007aff', '#ffffff', '#a855f7'];
      for (let i = 0; i < 85; i++) {
        plexusNodes.push({
          x: (Math.random() - 0.5) * window.innerWidth * 1.5,
          y: (Math.random() - 0.5) * window.innerHeight * 1.5,
          z: (Math.random() - 0.5) * 600,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2,
          vz: (Math.random() - 0.5) * 1.2,
          color: plexusColors[Math.floor(Math.random() * plexusColors.length)]
        });
      }

      const drawPlexus = () => {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const fov = 500;
        const projected = [];

        plexusNodes.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.z += p.vz;
          if (p.x < -window.innerWidth) p.vx *= -1; if (p.x > window.innerWidth) p.vx *= -1;
          if (p.y < -window.innerHeight) p.vy *= -1; if (p.y > window.innerHeight) p.vy *= -1;
          if (p.z < -400 || p.z > 400) p.vz *= -1;

          const scale = fov / (fov + p.z + 400);
          const px = cx + p.x * scale;
          const py = cy + p.y * scale;
          projected.push({ x: px, y: py, scale, color: p.color, z: p.z });

          ctx.beginPath();
          ctx.arc(px, py, 2.5 * scale, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10 * scale;
          ctx.fill();
        });

        ctx.lineWidth = 0.6;
        for (let i = 0; i < projected.length; i++) {
          for (let j = i + 1; j < projected.length; j++) {
            const p1 = projected[i];
            const p2 = projected[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < 130 * 130) {
              const alpha = (1 - Math.sqrt(distSq) / 130) * 0.35;
              ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }

          if (mouse.x > 0) {
            const mdx = projected[i].x - mouse.x;
            const mdy = projected[i].y - mouse.y;
            const mDistSq = mdx * mdx + mdy * mdy;
            if (mDistSq < 180 * 180) {
              const alpha = (1 - Math.sqrt(mDistSq) / 180) * 0.6;
              ctx.strokeStyle = `rgba(255, 215, 0, ${alpha})`;
              ctx.beginPath();
              ctx.moveTo(projected[i].x, projected[i].y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(drawPlexus);
      };
      drawPlexus();
    })();
  </script>

                  <th class="p-4">Expiry Date</th>
                  <th class="p-4">Ban Status</th>
                  <th class="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${usersList.length === 0 ? `
                  <tr>
                    <td colspan="5" class="p-8 text-center text-gray-500 font-sans">No user records found.</td>
                  </tr>
                ` : usersList.map(user => `
                  <tr class="border-b border-white/5 hover:bg-white/[0.01]">
                    <td class="p-4">
                      <span class="text-white font-semibold block">${user.email || "No Email"}</span>
                      <span class="text-[10px] text-gray-600 block truncate max-w-[180px]">${user.id}</span>
                    </td>
                    <td class="p-4">
                      <select onchange="updateUserPlan('${user.id}', this.value)" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500/40">
                        ${plans.map(p => `<option value="${p.id}" ${user.plan === p.id ? "selected" : ""}>${p.name}</option>`).join("")}
                      </select>
                    </td>
                    <td class="p-4">
                      <input type="date" value="${user.planExpiry ? user.planExpiry.substring(0, 10) : ""}" onchange="updateUserExpiry('${user.id}', this.value)" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500/40" />
                    </td>
                    <td class="p-4">
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${user.banned ? "text-red-400 bg-red-950/20 border border-red-500/20" : "text-green-400 bg-green-950/20 border border-green-500/20"}">
                        ${user.banned ? "BANNED" : "ACTIVE"}
                      </span>
                    </td>
                    <td class="p-4 text-right">
                      <button onclick="toggleUserBan('${user.id}', ${!!user.banned})" class="px-3 py-1.5 rounded-xl text-xs font-semibold ${user.banned ? "text-green-400 bg-green-500/10 border border-green-500/20" : "text-red-400 bg-red-500/10 border border-red-500/20"}">
                        ${user.banned ? "Unban" : "Ban Account"}
                      </button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Update user sub plan
    window.updateUserPlan = async (uid, planId) => {
      try {
        await updateDoc(doc(db, "users", uid), { plan: planId });
        showToast("User plan updated successfully!");
      } catch (err) {
        showToast("Failed: " + err.message, true);
      }
    };

    // Update user sub expiry date
    window.updateUserExpiry = async (uid, dateVal) => {
      try {
        const isoString = dateVal ? new Date(dateVal).toISOString() : null;
        await updateDoc(doc(db, "users", uid), { planExpiry: isoString });
        showToast("User expiry date updated!");
      } catch (err) {
        showToast("Failed: " + err.message, true);
      }
    };

    // Toggle ban state
    window.toggleUserBan = async (uid, isBanned) => {
      try {
        const reason = isBanned ? "" : (prompt("Specify ban reason:") || "Violation of ToS rules");
        await updateDoc(doc(db, "users", uid), {
          banned: !isBanned,
          bannedReason: reason
        });
        showToast(isBanned ? "User account unbanned." : "User account banned.");
        switchTab("users");
      } catch (err) {
        showToast("Failed: " + err.message, true);
      }
    };

    // 3. Render Custom Plans
    async function renderPlans(container) {
      const snap = await getDocs(collection(db, "plans"));
      const plansList = [];
      snap.forEach(d => plansList.push({ id: d.id, ...d.data() }));

      container.innerHTML = `
        <div class="flex justify-between items-center pb-4 border-b border-white/5">
          <div>
            <h1 class="text-3xl font-extrabold text-white">Premium Plans</h1>
            <p class="text-xs text-gray-500 font-mono mt-1">DEFINE AND CONFIGURE SUBSCRIPTION PRICING PACKAGES</p>
          </div>
          <button onclick="togglePlanForm(true)" class="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 px-4 py-2 border border-cyan-500/30 rounded-2xl text-xs font-bold transition-all duration-200">
            + New Collection Plan
          </button>
        </div>

        <div id="planFormContainer" class="hidden glass-panel p-6 rounded-3xl space-y-4 text-left">
          <h3 class="font-bold text-white text-base font-mono">Create Plan Collection</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Plan Name</label>
              <input id="newPlanName" placeholder="Elite Premium" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Price (₹ INR)</label>
              <input id="newPlanPrice" type="number" placeholder="499" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Duration (Days)</label>
              <input id="newPlanDuration" type="number" placeholder="30" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Max Apps Limit</label>
              <input id="newPlanMaxApps" type="number" placeholder="3" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Max Keys Limit</label>
              <input id="newPlanMaxKeys" type="number" placeholder="50" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Max Requests/Day</label>
              <input id="newPlanMaxReqs" type="number" placeholder="1000" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Aesthetic Card Color</label>
              <select id="newPlanColor" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                <option value="cyan">Cyan Glow</option>
                <option value="purple">Purple Glow</option>
                <option value="amber">Amber Glow</option>
                <option value="blue">Blue Glow</option>
                <option value="green">Green Glow</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Badge Title (e.g. HOT)</label>
              <input id="newPlanBadge" placeholder="POPULAR" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <div class="md:col-span-3">
              <label class="text-xs text-gray-400 font-mono block mb-2">Package Plan Features</label>
              <div class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-black/40 border border-white/10 rounded-2xl p-4">
                <label class="flex items-center space-x-2.5 text-xs text-gray-300 cursor-pointer hover:text-white select-none">
                  <input type="checkbox" name="planFeature" value="HWID Lock Protection" class="rounded border-white/10 bg-black/60 text-cyan-500 focus:ring-0 focus:ring-offset-0 w-4 h-4" checked />
                  <span>HWID Lock Protection</span>
                </label>
                <label class="flex items-center space-x-2.5 text-xs text-gray-300 cursor-pointer hover:text-white select-none">
                  <input type="checkbox" name="planFeature" value="Custom Webhook Integration" class="rounded border-white/10 bg-black/60 text-cyan-500 focus:ring-0 focus:ring-offset-0 w-4 h-4" />
                  <span>Custom Webhook Integration</span>
                </label>
                <label class="flex items-center space-x-2.5 text-xs text-gray-300 cursor-pointer hover:text-white select-none">
                  <input type="checkbox" name="planFeature" value="Developer SDK Access" class="rounded border-white/10 bg-black/60 text-cyan-500 focus:ring-0 focus:ring-offset-0 w-4 h-4" checked />
                  <span>Developer SDK Access</span>
                </label>
                <label class="flex items-center space-x-2.5 text-xs text-gray-300 cursor-pointer hover:text-white select-none">
                  <input type="checkbox" name="planFeature" value="Priority Live Support" class="rounded border-white/10 bg-black/60 text-cyan-500 focus:ring-0 focus:ring-offset-0 w-4 h-4" />
                  <span>Priority Live Support</span>
                </label>
                <label class="flex items-center space-x-2.5 text-xs text-gray-300 cursor-pointer hover:text-white select-none">
                  <input type="checkbox" name="planFeature" value="Early Beta Testing" class="rounded border-white/10 bg-black/60 text-cyan-500 focus:ring-0 focus:ring-offset-0 w-4 h-4" />
                  <span>Early Beta Testing</span>
                </label>
              </div>
            </div>
            <div>
              <label class="text-xs text-gray-400 font-mono block mb-1">Buy Redirect Link (URL)</label>
              <input id="newPlanRedirectUrl" placeholder="https://discord.gg/... or payment link" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
          </div>
          <div class="flex space-x-2">
            <button onclick="handleSavePlan()" class="bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 px-4 py-2 rounded-xl text-xs font-bold">Save Collection</button>
            <button onclick="togglePlanForm(false)" class="text-gray-400 text-xs px-4 py-2">Discard</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          ${plansList.length === 0 ? `
            <div class="md:col-span-3 text-center py-16 text-gray-500 font-sans">No custom packages created. Add one above.</div>
          ` : plansList.map(plan => `
            <div class="glass-panel p-6 rounded-2xl border-cyan-500/20 text-left flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start mb-3">
                  <h3 class="font-extrabold text-white text-lg">${plan.name}</h3>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold text-cyan-400 bg-cyan-950/20 border border-cyan-800/40">${plan.badge || "ACTIVE"}</span>
                </div>
                <div class="text-2xl font-black text-white font-mono">₹${plan.price} <span class="text-xs text-gray-500 font-sans font-normal">/${plan.durationDays}d</span></div>
                <div class="space-y-1 mt-4 mb-6 text-xs text-gray-400 font-mono">
                  <div>Apps: ${plan.maxApps}</div>
                  <div>Keys: ${plan.maxLicenseKeys}</div>
                  <div>Reqs/day: ${plan.maxRequestsPerDay}</div>
                  <div class="text-[10px] text-gray-500 mt-2 truncate max-w-xs" title="${plan.redirectUrl || ''}">Redirect: ${plan.redirectUrl || 'Default Discord'}</div>
                </div>
              </div>
              <button onclick="handleDeletePlan('${plan.id}')" class="w-full py-2 rounded-xl text-xs font-bold text-red-400 bg-red-500/10 border border-red-500/20 hover:bg-red-500/20 transition-all duration-200">
                Delete Collection
              </button>
            </div>
          `).join("")}
        </div>
      `;
    }

    // Toggle Form visibility
    window.togglePlanForm = (show) => {
      document.getElementById("planFormContainer").classList.toggle("hidden", !show);
    };

    // Save Custom Plan
    window.handleSavePlan = async () => {
      try {
        const name = document.getElementById("newPlanName").value.trim();
        const price = parseInt(document.getElementById("newPlanPrice").value) || 0;
        const duration = parseInt(document.getElementById("newPlanDuration").value) || 30;
        const maxApps = parseInt(document.getElementById("newPlanMaxApps").value) || 1;
        const maxKeys = parseInt(document.getElementById("newPlanMaxKeys").value) || 5;
        const maxReqs = parseInt(document.getElementById("newPlanMaxReqs").value) || 100;
        const color = document.getElementById("newPlanColor").value;
        const badge = document.getElementById("newPlanBadge").value.trim();
        const checkboxes = document.querySelectorAll('input[name="planFeature"]:checked');
        const features = Array.from(checkboxes).map(cb => cb.value);
        const redirectUrl = document.getElementById("newPlanRedirectUrl").value.trim();

        if (!name) {
          showToast("Package name is required.", true);
          return;
        }

        await addDoc(collection(db, "plans"), {
          name, price, durationDays: duration, maxApps, maxLicenseKeys: maxKeys, maxRequestsPerDay: maxReqs,
          color, badge, features, redirectUrl, active: true
        });

        showToast("New premium plan published!");
        switchTab("plans");
      } catch (err) {
        showToast("Save failed: " + err.message, true);
      }
    };

    // Delete Plan
    window.handleDeletePlan = async (pid) => {
      if (!confirm("Are you sure you want to delete this custom plan collection?")) return;
      try {
        await deleteDoc(doc(db, "plans", pid));
        showToast("Plan collection removed.");
        switchTab("plans");
      } catch (err) {
        showToast("Delete failed: " + err.message, true);
      }
    };

    // 4. Render License Keys manager
    async function renderKeys(container) {
      const keysSnap = await getDocs(collection(db, "licenses"));
      const keysList = [];
      keysSnap.forEach(d => keysList.push({ id: d.id, ...d.data() }));

      container.innerHTML = `
        <div class="flex justify-between items-center pb-4 border-b border-white/5">
          <div>
            <h1 class="text-3xl font-extrabold text-white">License Keys</h1>
            <p class="text-xs text-gray-500 font-mono mt-1">INSPECT DEVICE BOUNDS AND MANAGE HWID RESTRICTIONS</p>
          </div>
          <span class="text-xs text-gray-400 font-mono bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl">${keysList.length} Keys Total</span>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm font-mono text-left border-collapse">
              <thead>
                <tr class="bg-white/5 text-gray-400 border-b border-white/5 text-xs">
                  <th class="p-4">Key Value</th>
                  <th class="p-4">Application ID</th>
                  <th class="p-4">Bound HWID</th>
                  <th class="p-4">Status</th>
                  <th class="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${keysList.length === 0 ? `
                  <tr>
                    <td colspan="5" class="p-8 text-center text-gray-500 font-sans">No generated licenses registered in database.</td>
                  </tr>
                ` : keysList.map(lic => `
                  <tr class="border-b border-white/5 hover:bg-white/[0.01]">
                    <td class="p-4">
                      <span class="text-white font-bold block">${lic.key || "—"}</span>
                    </td>
                    <td class="p-4 text-gray-500">${lic.appId || "Unknown App"}</td>
                    <td class="p-4">
                      ${lic.hwid ? `
                        <span class="text-cyan-400 bg-cyan-950/20 px-2 py-0.5 rounded border border-cyan-800/40 truncate max-w-[120px] inline-block" title="${lic.hwid}">${lic.hwid.substring(0, 10)}...</span>
                      ` : `<span class="text-gray-600">—</span>`}
                    </td>
                    <td class="p-4">
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${lic.status === "active" ? "text-cyan-400 bg-cyan-950/20 border border-cyan-800/40" : lic.status === "unused" ? "text-green-400 bg-green-950/20 border border-green-800/40" : "text-red-400 bg-red-950/20 border border-red-800/40"}">
                        ${(lic.status || "unused").toUpperCase()}
                      </span>
                    </td>
                    <td class="p-4 text-right space-x-2">
                      ${lic.hwid ? `
                        <button onclick="clearKeyHwid('${lic.id}')" class="px-2.5 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20 text-amber-400 rounded-xl text-xs font-semibold">
                          Clear HWID
                        </button>
                      ` : ""}
                      <button onclick="deleteLicenseKey('${lic.id}')" class="px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 rounded-xl text-xs font-semibold">
                        Delete Key
                      </button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Clear key bound HWID
    window.clearKeyHwid = async (kid) => {
      try {
        await updateDoc(doc(db, "licenses", kid), { hwid: null });
        showToast("HWID lock released for key.");
        switchTab("keys");
      } catch (err) {
        showToast("Reset failed: " + err.message, true);
      }
    };

    // Delete License Key
    window.deleteLicenseKey = async (kid) => {
      if (!confirm("Permanently delete this license key from database?")) return;
      try {
        await deleteDoc(doc(db, "licenses", kid));
        showToast("License key deleted.");
        switchTab("keys");
      } catch (err) {
        showToast("Delete failed: " + err.message, true);
      }
    };

    // Global Toast Notifier Helper
    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-2xl text-sm font-semibold z-50 transition-all duration-300 pointer-events-none transform translate-y-0 opacity-100 ${
        isError ? "bg-red-500 text-white shadow-[0_0_30px_rgba(239,68,68,0.2)]" : "bg-cyan-500 text-black shadow-[0_0_30px_rgba(6,182,212,0.2)]"
      }`;
      setTimeout(() => {
        toast.className = "fixed bottom-6 right-6 px-5 py-3 rounded-2xl text-sm font-semibold z-50 opacity-0 transform translate-y-2 transition-all duration-300 pointer-events-none";
      }, 2500);
    }
  </script>
</body>
</html>
